[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-transformer-lab"
version = "0.1.0"
description = "Reproducible transformer compilation and execution experiments with JAX/XLA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jax==0.8.2", "numpy>=2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.12"]
gpu = ["jax[cuda13]==0.8.2; platform_system == 'Linux'"]

[project.scripts]
jax-lab = "jax_transformer_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a JAX GPU backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

